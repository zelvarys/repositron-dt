name: Bug report
description: Report a reproducible problem with repositron
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication
        - Repository scanning
        - Dashboard
        - Repository picker
        - TUI rendering
        - Activity
        - Dependencies
        - CI
        - Tool adoption
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant terminal output, error messages, and screenshots.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, terminal, Node version, and shell.
      placeholder: macOS 15, iTerm2, Node 24, zsh
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
