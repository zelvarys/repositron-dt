<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Repositron, repository health in your terminal</title>
  <desc id="desc">Dark cover artwork with the Repositron mark, a short product statement, feature labels, and health statistics.</desc>
  <defs>
    <linearGradient id="brand" x1="72" y1="48" x2="1210" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#2563eb" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#22c55e" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#27272a" stroke-opacity=".55"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#09090b"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity=".42"/>
  <ellipse cx="980" cy="320" rx="410" ry="340" fill="url(#blueGlow)"/>
  <ellipse cx="180" cy="590" rx="360" ry="230" fill="url(#greenGlow)"/>
  <path d="M0 610H1280" stroke="#1c1c1f"/>

  <g transform="translate(72 62)">
    <rect width="50" height="50" rx="14" fill="#0b1220" stroke="url(#brand)" stroke-width="2"/>
    <path d="M12 15 22 25 12 35" fill="none" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 35h12" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text x="140" y="96" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#f8fafc" letter-spacing="2">REPOSITRON</text>
  <text x="141" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#71717a" letter-spacing="2">LOCAL-FIRST GITHUB REPOSITORY HEALTH</text>

  <text x="72" y="236" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#60a5fa" letter-spacing="3">SEE THE WHOLE REPOSITORY</text>
  <text x="72" y="310" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#f8fafc" letter-spacing="-2">Know your repo.</text>
  <text x="72" y="382" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#f8fafc" letter-spacing="-2">Ship with <tspan fill="#60a5fa">signal.</tspan></text>
  <text x="74" y="424" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#a1a1aa">Activity, adoption, dependencies, CI, and bus factor</text>
  <text x="74" y="452" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#a1a1aa">in one keyboard-driven terminal view.</text>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#d4d4d8">
    <rect x="72" y="470" width="116" height="34" rx="17" fill="#111318" stroke="#27272a"/>
    <text x="130" y="492" text-anchor="middle">ACTIVITY</text>
    <rect x="198" y="470" width="122" height="34" rx="17" fill="#111318" stroke="#27272a"/>
    <text x="259" y="492" text-anchor="middle">BUS FACTOR</text>
    <rect x="330" y="470" width="136" height="34" rx="17" fill="#111318" stroke="#27272a"/>
    <text x="398" y="492" text-anchor="middle">DEPENDENCIES</text>
    <rect x="476" y="470" width="100" height="34" rx="17" fill="#111318" stroke="#27272a"/>
    <text x="526" y="492" text-anchor="middle">CI HEALTH</text>
    <rect x="586" y="470" width="144" height="34" rx="17" fill="#111318" stroke="#27272a"/>
    <text x="658" y="492" text-anchor="middle">TOOL ADOPTION</text>
  </g>

  <g>
    <rect x="72" y="548" width="286" height="44" rx="12" fill="#0f1116" stroke="#27272a"/>
    <text x="92" y="576" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#4ade80">$</text>
    <text x="112" y="576" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#f8fafc">npx repositron</text>
    <text x="378" y="576" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#71717a">NO BACKEND · NO DATABASE · MIT</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="958" cy="320" r="124" fill="none" stroke="#27272a"/>
    <circle cx="958" cy="320" r="110" fill="none" stroke="#1f2937"/>
    <g transform="translate(958 320) scale(.68) translate(-958 -320)">
      <path d="M958 174 1085 247v146L958 466 831 393V247Z" fill="#0b1220" stroke="url(#brand)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M913 274 946 307 913 340" fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M963 344h46" fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round"/>
      <circle cx="1063" cy="221" r="8" fill="#4ade80"/>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g>
      <rect x="706" y="124" width="152" height="66" rx="14" fill="#0f1116" stroke="#27272a"/>
      <text x="726" y="152" font-size="23" font-weight="700" fill="#f8fafc">84.2</text>
      <text x="726" y="172" font-size="12" fill="#71717a" letter-spacing="1">HEALTH SCORE</text>
    </g>
    <g>
      <rect x="1090" y="212" width="128" height="66" rx="14" fill="#0f1116" stroke="#27272a"/>
      <text x="1110" y="240" font-size="23" font-weight="700" fill="#4ade80">92%</text>
      <text x="1110" y="260" font-size="12" fill="#71717a" letter-spacing="1">CI SUCCESS</text>
    </g>
    <g>
      <rect x="1040" y="450" width="170" height="66" rx="14" fill="#0f1116" stroke="#27272a"/>
      <text x="1060" y="478" font-size="23" font-weight="700" fill="#facc15">7</text>
      <text x="1060" y="498" font-size="12" fill="#71717a" letter-spacing="1">OUTDATED DEPS</text>
    </g>
    <g>
      <rect x="708" y="450" width="172" height="66" rx="14" fill="#0f1116" stroke="#27272a"/>
      <text x="728" y="478" font-size="23" font-weight="700" fill="#60a5fa">38.2%</text>
      <text x="728" y="498" font-size="12" fill="#71717a" letter-spacing="1">TOP CONTRIBUTOR</text>
    </g>
  </g>
</svg>
